<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>

  <!-- link css -->
  <link rel="stylesheet" href="style.css">

  <!-- link font -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="main">
    <h1>BMI Calculator</h1>
    <form id="form">
      <label for="height">Height</label>
      <input type="number" id="height" placeholder="in cm">

      <label for="weight">Weight</label>
      <input type="number" id="weight" placeholder="in kg">

      <button id="button">Calculate</button>
    </form>

    <div class="result">
      <h4>Your BMI Score</h4>
      <h2 id="score">50.20</h2>
    </div>

    <div class="info">
      <h4>BMI weight guide</h4>
      <p>Under Weight = Less than 18.6</p>
      <p>Normal Weight = 18.6 to 24.9</p>
      <p>Over Weight = Greater than 24.9</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
